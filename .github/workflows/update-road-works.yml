name: Update Road Works Data

on:
  schedule:
    # 18:20 UTC = 02:20 Macau (UTC+8), after the upstream XML export (00:30
    # Macau) and the data.gov.mo platform's own next refresh at 01:09 Macau.
    # The off-the-hour minute plus the in-job random delay below jitters our
    # fetch window so it doesn't land at a fixed predictable time every day.
    # Combined window lands somewhere in 02:20–03:10 Macau.
    - cron: '20 18 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Consumed by the deploy job below.
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: latest

      - name: Random pre-fetch delay (jitter)
        # Skipped on workflow_dispatch so manual triggers run immediately.
        # 0–3000s = 0–50 minutes of jitter on top of the cron minute, so the
        # actual fetch lands somewhere in the 02:20–03:10 Macau window.
        if: github.event_name == 'schedule'
        run: |
          delay=$((RANDOM % 3000))
          echo "Sleeping ${delay}s before fetching..."
          sleep "$delay"

      - name: Fetch DSAT road-works notices (with retry)
        working-directory: data
        # Outer retry on top of fetch_road_works.py's own in-process
        # 6-attempt backoff (it already retries the intermittent
        # {"msg":"內部錯誤","code":1} response on its own). If it still exits
        # non-zero — e.g. a persistent non-ZIP body or a sub-MIN_NOTICES
        # parse — wait 60s and try once more rather than leave
        # road-works.json unrefreshed for the day.
        run: |
          attempt=1
          max_attempts=2
          until uv run python scripts/fetch_road_works.py; do
            if [ $attempt -ge $max_attempts ]; then
              echo "::error::fetch_road_works.py failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::fetch_road_works.py attempt $attempt failed — retrying in 60s"
            sleep 60
            attempt=$((attempt + 1))
          done

      - name: Validate output before commit
        working-directory: data
        # Hard gate: a malformed scrape fails the run here, before the commit
        # step, so broken data can never auto-deploy to production.
        run: uv run python scripts/validate_output.py road-works

      - name: Commit and push if changed
        id: commit
        uses: ./.github/actions/commit-data
        with:
          file: public/data/road-works.json
          message: 'chore: update DSAT road-works notices'

  # Pushes made with the default GITHUB_TOKEN don't fire `on: push` workflows
  # (anti-recursion), so the data commit above would never reach the live site
  # on its own. Invoke the deploy workflow explicitly when we committed.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: master
    secrets: inherit
