name: Ferry Schedules

on:
  schedule:
    - cron: '0 0 1 * *' # 1st of each month, 00:00 UTC (08:00 Macau)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Consumed by the deploy job below.
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Scrape Turbojet ferry schedules
        working-directory: data
        run: uv run python scripts/fetch_ferry_schedules.py

      - name: Validate output before commit
        working-directory: data
        # Hard gate: a malformed scrape fails the run here, before the commit
        # step, so broken data can never auto-deploy to production.
        run: uv run python scripts/validate_output.py ferries

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet public/data/ferry-schedules.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        # Retries on push race conditions: when another workflow or manual
        # commit lands on master between our checkout and our push, the
        # naive `git push` is rejected. We fetch + rebase on origin/master
        # and retry up to 5 times. Each scheduled job touches a different
        # JSON file so rebase conflicts are unexpected; if one happens we
        # abort and fail the run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ferry-schedules.json
          git commit -m "chore: update ferry schedules"
          n=0
          max=5
          until git push; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::push failed after $n attempts"
              exit 1
            fi
            echo "::warning::push rejected — fetching origin/master and rebasing (attempt $n/$max)"
            git fetch origin master
            if ! git rebase origin/master; then
              echo "::error::rebase conflict — aborting"
              git rebase --abort || true
              exit 1
            fi
            sleep $((RANDOM % 5 + 1))
          done

  # Pushes made with the default GITHUB_TOKEN don't fire `on: push` workflows
  # (anti-recursion), so the data commit above would never reach the live site
  # on its own. Invoke the deploy workflow explicitly when we committed.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: master
    secrets: inherit
