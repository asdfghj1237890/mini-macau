name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  # Callable from the scheduled data workflows: pushes made with the default
  # GITHUB_TOKEN don't fire `on: push` workflows (GitHub's anti-recursion
  # rule), so each data bot invokes this workflow directly after committing
  # fresh JSON — otherwise the live site would only update on human pushes.
  workflow_call:
    inputs:
      ref:
        description: >-
          Ref to deploy. Data bots pass `master` so the checkout includes the
          commit they pushed mid-run (their github.sha predates it).
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty for push events → falls back to the exact pushed sha.
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on the same checks as CI, so a direct push to master
      # that fails lint/tests never reaches production.
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

      - run: npm run build

      - name: Install Wrangler
        run: npm i -g wrangler

      - name: Create Pages project if not exists
        run: wrangler pages project create mini-map-macau --production-branch=master || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        # --branch=master is required: checkout at a bare sha leaves a
        # detached HEAD, wrangler then reports the branch as "head" and
        # Cloudflare files the deploy as a PREVIEW (head.*.pages.dev)
        # instead of production. Pinning the branch makes every run a
        # production deployment regardless of checkout state.
        run: wrangler pages deploy dist/ --project-name=mini-map-macau --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
