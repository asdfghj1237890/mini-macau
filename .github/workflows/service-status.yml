name: Bus Service Status

on:
  schedule:
    - cron: '0 23 * * *' # UTC 23:00 = Macau 07:00 (UTC+8)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Scrape today's service status
        working-directory: data
        run: uv run python scripts/fetch_service_status.py

      - name: Validate output before commit
        working-directory: data
        # Hard gate: a malformed scrape fails the run here, before the commit
        # step, so broken data can never auto-deploy to production.
        run: uv run python scripts/validate_output.py service-status

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet public/service-status.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        # Retries on push race conditions: when another workflow or manual
        # commit lands on master between our checkout and our push, the
        # naive `git push` is rejected. We fetch + rebase on origin/master
        # and retry up to 5 times. Each scheduled job touches a different
        # JSON file so rebase conflicts are unexpected; if one happens we
        # abort and fail the run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/service-status.json
          git commit -m "chore: update bus service status"
          n=0
          max=5
          until git push; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::push failed after $n attempts"
              exit 1
            fi
            echo "::warning::push rejected — fetching origin/master and rebasing (attempt $n/$max)"
            git fetch origin master
            if ! git rebase origin/master; then
              echo "::error::rebase conflict — aborting"
              git rebase --abort || true
              exit 1
            fi
            sleep $((RANDOM % 5 + 1))
          done
