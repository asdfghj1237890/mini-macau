name: Update DSPA Stats

on:
  schedule:
    # Monthly, on the 1st at 19:20 UTC = 03:20 Macau (UTC+8). Six upstream DSPA
    # gateway calls (incinerator, hazardous station, landfill, 3 of the 4
    # WWTPs — wwtp.macau's daily feed is the same one call, just heavier) that
    # only add one new month each; `workflow_dispatch` covers anything urgent.
    # The slot keeps clear of update-waste.yml's own 19:10 UTC run, and the
    # off-the-hour minute plus the in-job random delay below jitters the fetch
    # window so it doesn't land at a fixed predictable time.
    - cron: '20 19 1 * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Consumed by the deploy job below.
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: latest

      - name: Random pre-fetch delay (jitter)
        # Skipped on workflow_dispatch so manual triggers run immediately.
        # 0–3000s = 0–50 minutes of jitter on top of the cron minute, so the
        # actual fetch lands somewhere in the 03:20–04:10 Macau window.
        if: github.event_name == 'schedule'
        run: |
          delay=$((RANDOM % 3000))
          echo "Sleeping ${delay}s before fetching..."
          sleep "$delay"

      - name: Fetch DSPA monthly statistics (with retry)
        working-directory: data
        env:
          DATAGOVMO_APPCODE: ${{ secrets.DATAGOVMO_APPCODE }}
        # Outer retry on top of fetch_dspa_stats.py's own in-process backoff
        # and its own per-series best-effort (a single flaky endpoint already
        # degrades to a null series without failing the script). If the
        # script still exits non-zero — e.g. DATAGOVMO_APPCODE missing or an
        # unexpected crash — wait 60s and try once more rather than leave
        # dspa-stats.json unrefreshed for the month.
        run: |
          attempt=1
          max_attempts=2
          until uv run python scripts/fetch_dspa_stats.py; do
            if [ $attempt -ge $max_attempts ]; then
              echo "::error::fetch_dspa_stats.py failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::fetch_dspa_stats.py attempt $attempt failed — retrying in 60s"
            sleep 60
            attempt=$((attempt + 1))
          done

      - name: Validate output before commit
        working-directory: data
        # Hard gate: a malformed scrape fails the run here, before the commit
        # step, so broken data can never auto-deploy to production.
        run: uv run python scripts/validate_output.py dspa-stats

      - name: Commit and push if changed
        id: commit
        uses: ./.github/actions/commit-data
        with:
          file: public/data/dspa-stats.json
          message: 'chore: update DSPA monthly statistics'

  # Pushes made with the default GITHUB_TOKEN don't fire `on: push` workflows
  # (anti-recursion), so the data commit above would never reach the live site
  # on its own. Invoke the deploy workflow explicitly when we committed.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: master
    secrets: inherit
