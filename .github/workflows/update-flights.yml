name: Update Flight Data

on:
  schedule:
    # 23:07 UTC = 07:07 Macau (UTC+8). The off-the-hour minute plus the
    # in-job random delay below jitters our scrape window so it doesn't
    # land at a fixed predictable time every day. Combined window lands
    # somewhere in 07:07–07:57 Macau.
    - cron: '7 23 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Random pre-fetch delay (jitter)
        # Skipped on workflow_dispatch so manual triggers run immediately.
        # 0–3000s = 0–50 minutes of jitter on top of the cron minute, so the
        # actual fetch lands somewhere in the 07:07–07:57 Macau window.
        if: github.event_name == 'schedule'
        run: |
          delay=$((RANDOM % 3000))
          echo "Sleeping ${delay}s before fetching..."
          sleep "$delay"

      - name: Fetch MFM flight data (with retry)
        working-directory: data
        # Outer retry on top of fetch_page's in-process 3-attempt retry.
        # If the script still exits non-zero (safety guard tripped — 0 rows
        # parsed across both upstream pages) we wait 60s and try once more.
        # Covers the "upstream flaked for a minute straight" window seen on
        # 2026-04-21 20:25 UTC without overwriting flights.json with [].
        run: |
          attempt=1
          max_attempts=2
          until uv run python scripts/fetch_flights.py; do
            if [ $attempt -ge $max_attempts ]; then
              echo "::error::fetch_flights.py failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::fetch_flights.py attempt $attempt failed — retrying in 60s"
            sleep 60
            attempt=$((attempt + 1))
          done
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          # `realtime` URLs — used when target_date == today in Macau (UTC+8).
          UPSTREAM_DEP_EN_URL_REALTIME: ${{ secrets.UPSTREAM_DEP_EN_URL_REALTIME }}
          UPSTREAM_DEP_ZH_URL_REALTIME: ${{ secrets.UPSTREAM_DEP_ZH_URL_REALTIME }}
          UPSTREAM_ARR_EN_URL_REALTIME: ${{ secrets.UPSTREAM_ARR_EN_URL_REALTIME }}
          UPSTREAM_ARR_ZH_URL_REALTIME: ${{ secrets.UPSTREAM_ARR_ZH_URL_REALTIME }}
          # `timetable` URLs — used for any non-today target_date.
          UPSTREAM_DEP_EN_URL_TIMETABLE: ${{ secrets.UPSTREAM_DEP_EN_URL_TIMETABLE }}
          UPSTREAM_DEP_ZH_URL_TIMETABLE: ${{ secrets.UPSTREAM_DEP_ZH_URL_TIMETABLE }}
          UPSTREAM_ARR_EN_URL_TIMETABLE: ${{ secrets.UPSTREAM_ARR_EN_URL_TIMETABLE }}
          UPSTREAM_ARR_ZH_URL_TIMETABLE: ${{ secrets.UPSTREAM_ARR_ZH_URL_TIMETABLE }}
          # Legacy unsuffixed names — the script falls back to these for
          # `timetable` mode if the *_TIMETABLE secrets aren't rotated yet.
          UPSTREAM_DEP_EN_URL: ${{ secrets.UPSTREAM_DEP_EN_URL }}
          UPSTREAM_DEP_ZH_URL: ${{ secrets.UPSTREAM_DEP_ZH_URL }}
          UPSTREAM_ARR_EN_URL: ${{ secrets.UPSTREAM_ARR_EN_URL }}
          UPSTREAM_ARR_ZH_URL: ${{ secrets.UPSTREAM_ARR_ZH_URL }}

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet public/data/flights.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        # Retries on push race conditions: when another workflow or manual
        # commit lands on master between our checkout and our push, the
        # naive `git push` is rejected. We fetch + rebase on origin/master
        # and retry up to 5 times. Each scheduled job touches a different
        # JSON file so rebase conflicts are unexpected; if one happens we
        # abort and fail the run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/flights.json
          git commit -m "chore: update MFM flight data"
          n=0
          max=5
          until git push; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::push failed after $n attempts"
              exit 1
            fi
            echo "::warning::push rejected — fetching origin/master and rebasing (attempt $n/$max)"
            git fetch origin master
            if ! git rebase origin/master; then
              echo "::error::rebase conflict — aborting"
              git rebase --abort || true
              exit 1
            fi
            sleep $((RANDOM % 5 + 1))
          done
